services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: joblite
      POSTGRES_PASSWORD: joblite_local_only
      POSTGRES_DB: joblite_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - joblite_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblite -d joblite_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  joblite_pg:
